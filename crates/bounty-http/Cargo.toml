[package]
name = "bounty-http"
description = "Bounty HTTP surface: pair, reports, admin adjudicate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bounty-challenge-task = { path = "../bounty-challenge-task" }
bounty-score = { path = "../bounty-score" }
bounty-store = { path = "../bounty-store" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
