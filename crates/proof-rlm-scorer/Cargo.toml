[package]
name = "proof-rlm-scorer"
description = "Proof RLM host side: RlmScorer (LiveScorer over the custom-runner registry, the RLM store, and the topic-VM boundary) and the topic-scoped artefact store ({root}/{topic_id}/{submission_id}.zip, best pointer, public events)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
hex = "0.4"
proof-canon = { path = "../proof-canon" }
proof-eval = { path = "../proof-eval" }
proof-executor = { path = "../proof-executor" }
proof-rlm = { path = "../proof-rlm" }
proof-rlm-store = { path = "../proof-rlm-store" }
proof-score = { path = "../proof-score" }
proof-task = { path = "../proof-task" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
crypto = { path = "../crypto" }
hex = "0.4"
http-body-util = "0.1"
proof-experiment = { path = "../proof-experiment" }
proof-http = { path = "../proof-http" }
proof-rlm = { path = "../proof-rlm", features = ["test-fixtures"] }
proof-submit = { path = "../proof-submit" }
proof-store = { path = "../proof-store" }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
