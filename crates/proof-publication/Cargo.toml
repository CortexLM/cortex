[package]
name = "proof-publication"
description = "Authenticated immutable Proof round publication wire protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
bundle = { path = "../bundle" }
challenge-common = { path = "../challenge-common" }
crypto = { path = "../crypto" }
hex = "0.4"
parity-scale-codec = { version = "3.7", default-features = false, features = ["derive"] }
proof-autonomy = { path = "../proof-autonomy" }
proof-research = { path = "../proof-research" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
