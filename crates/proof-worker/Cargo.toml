[package]
name = "proof-worker"
description = "Fenced durable Proof controller worker and headless runtime supervision"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
hex = "0.4"
proof-autonomy = { path = "../proof-autonomy" }
proof-autonomy-pg = { path = "../proof-autonomy-pg" }
proof-broker = { path = "../proof-broker" }
proof-research = { path = "../proof-research" }
proof-runtime = { path = "../proof-runtime" }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "signal", "fs", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
challenge-common = { path = "../challenge-common" }
crypto = { path = "../crypto" }
db = { path = "../db", features = ["testing"] }
proof-task = { path = "../proof-task" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
