[package]
name = "proof-wandb"
description = "Allowlist-safe Weights & Biases artifact publisher for Proof public evidence"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
proof-autonomy = { path = "../proof-autonomy" }
proof-research = { path = "../proof-research" }
proof-task = { path = "../proof-task" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
