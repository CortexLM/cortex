[package]
name = "proof-submit"
description = "Miner Proof submit signatures under base-proof-submit-v1"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
crypto = { path = "../crypto" }
proof-canon = { path = "../proof-canon" }
proof-store = { path = "../proof-store" }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lints]
workspace = true
