[package]
name = "relearn-mm-http"
description = "Relearn Multimodal HTTP surface: submit, status, admin promote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hex = "0.4"
relearn-mm-eval = { path = "../relearn-mm-eval" }
relearn-mm-score = { path = "../relearn-mm-score" }
relearn-mm-store = { path = "../relearn-mm-store" }
relearn-mm-task = { path = "../relearn-mm-task" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
