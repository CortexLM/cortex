[package]
name = "proof-http"
description = "Proof HTTP surface: topics, submit, status, admin publish"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
hex = "0.4"
proof-canon = { path = "../proof-canon" }
proof-eval = { path = "../proof-eval" }
proof-executor = { path = "../proof-executor" }
proof-score = { path = "../proof-score" }
proof-store = { path = "../proof-store" }
proof-submit = { path = "../proof-submit" }
proof-task = { path = "../proof-task" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
crypto = { path = "../crypto" }
http-body-util = "0.1"
proof-submit = { path = "../proof-submit" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
