[package]
name = "proof-challenge"
description = "Proof orchestrator: signed topics, eval, D24 emit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
bundle = { path = "../bundle" }
chain = { path = "../chain" }
challenge-common = { path = "../challenge-common" }
hex = "0.4"
proof-eval = { path = "../proof-eval" }
proof-executor = { path = "../proof-executor" }
proof-http = { path = "../proof-http" }
proof-score = { path = "../proof-score" }
proof-store = { path = "../proof-store" }
proof-task = { path = "../proof-task" }
proof-topic-install = { path = "../proof-topic-install" }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
trustroot = { path = "../trustroot" }

[dev-dependencies]
async-trait = "0.1"
axum = "0.8"
crypto = { path = "../crypto" }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
