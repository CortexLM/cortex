[package]
name = "relearn-t2i-http"
description = "Relearn Image HTTP surface: submit, status, prompt split, admin promote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hex = "0.4"
relearn-t2i-eval = { path = "../relearn-t2i-eval" }
relearn-t2i-judge = { path = "../relearn-t2i-judge" }
relearn-t2i-score = { path = "../relearn-t2i-score" }
relearn-t2i-store = { path = "../relearn-t2i-store" }
relearn-t2i-task = { path = "../relearn-t2i-task" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
async-trait = "0.1"
http-body-util = "0.1"
prism-competition = { path = "../prism-competition" }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
