[package]
name = "proof-broker"
description = "Consent-bound Proof provider orchestration and verified cleanup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
proof-autonomy = { path = "../proof-autonomy" }
proof-autonomy-pg = { path = "../proof-autonomy-pg" }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
challenge-common = { path = "../challenge-common" }
crypto = { path = "../crypto" }
db = { path = "../db", features = ["testing"] }
hex = "0.4"
serde = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
