[package]
name = "proof-store"
description = "In-memory Proof store: signed topics, per-topic holdout, baselines, submissions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
proof-score = { path = "../proof-score" }
proof-task = { path = "../proof-task" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }

[lints]
workspace = true

[dev-dependencies]
db = { path = "../db", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
