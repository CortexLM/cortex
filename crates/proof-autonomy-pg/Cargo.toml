[package]
name = "proof-autonomy-pg"
description = "Durable Proof experiment commands, consent and controller fencing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
db = { path = "../db" }
proof-autonomy = { path = "../proof-autonomy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "postgres", "uuid", "json", "macros",
] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
challenge-common = { path = "../challenge-common" }
crypto = { path = "../crypto" }
db = { path = "../db", features = ["testing"] }
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
