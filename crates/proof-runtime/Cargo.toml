[package]
name = "proof-runtime"
description = "Fenced private bridge between Cortex agents and Proof controllers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
proof-autonomy = { path = "../proof-autonomy" }
proof-autonomy-pg = { path = "../proof-autonomy-pg" }
proof-research = { path = "../proof-research" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "sync"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
challenge-common = { path = "../challenge-common" }
crypto = { path = "../crypto" }
db = { path = "../db", features = ["testing"] }
hex = "0.4"
http-body-util = "0.1"
proof-eval = { path = "../proof-eval" }
proof-score = { path = "../proof-score" }
proof-task = { path = "../proof-task" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
