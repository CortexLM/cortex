[package]
name = "relearn-agent-http"
description = "Relearn Agent HTTP surface: submit, status, admin promote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hex = "0.4"
relearn-agent-eval = { path = "../relearn-agent-eval" }
relearn-agent-score = { path = "../relearn-agent-score" }
relearn-agent-store = { path = "../relearn-agent-store" }
relearn-agent-task = { path = "../relearn-agent-task" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[dev-dependencies]
async-trait = "0.1"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
