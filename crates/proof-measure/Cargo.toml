[package]
name = "proof-measure"
description = "Trusted controller-side metric/FLOP observer over a pinned local proof-eval image"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
proof-autonomy = { path = "../proof-autonomy" }
proof-eval = { path = "../proof-eval" }
proof-harvest = { path = "../proof-harvest" }
proof-research = { path = "../proof-research" }
proof-score = { path = "../proof-score" }
proof-store = { path = "../proof-store" }
proof-task = { path = "../proof-task" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
