[package]
name = "proof-topic-bundle"
description = "Proof topic install bundle: the operator procedure that publishes one signed topic (schema, cross-checks against the signed document, canonical digest, install plan)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hex = "0.4"
proof-canon = { path = "../proof-canon" }
proof-experiment = { path = "../proof-experiment" }
proof-task = { path = "../proof-task" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"

[lints]
workspace = true
