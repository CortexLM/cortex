[package]
name = "proof-topic-bundle"
description = "Proof topic install bundle: the JSON an operator installs a topic from (schema, shape checks, canonical digest, install plan)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hex = "0.4"
proof-canon = { path = "../proof-canon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lints]
workspace = true
