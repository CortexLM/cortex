[package]
name = "proof-rlm"
description = "Generic Proof RLM engine: topic-carried checklist rules + spend gate, per-topic lifecycle with owner hooks, custom-runner registry (fail-closed), topic-VM orchestrator boundary (unwired stub), promotion rule. No challenge content."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Exposes `proof_rlm::fixtures` (fake orchestrator, canned report) to sibling crates' tests.
test-fixtures = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
proof-canon = { path = "../proof-canon" }
proof-experiment = { path = "../proof-experiment" }
proof-score = { path = "../proof-score" }
proof-task = { path = "../proof-task" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
