# base control-plane stack
#
# Default: postgres + validator + updater + socket-proxy + the four live
# challenges (relearn, relearn-image, relearn-agent, bounty).
# relearn-mm is OFF: it has no trust-root row, so it is behind the `mm`
# profile and never comes up on a default or master stack.
# Master/owner host only:
#   docker compose --profile master up -d
# brings gateway as an additional service (D3).
#
# External images are digest-pinned (no floating tags).
# docker.sock is mounted ONLY on socket-proxy (read-only).
# Secrets: age-decrypted env files mode 0600 under deploy/env/ (never baked into images).

name: base

services:
  postgres:
    image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    restart: unless-stopped
    env_file:
      - path: ./deploy/env/postgres.env
        required: true
    volumes:
      - base-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - base
    # No host ports by default — apps reach postgres on the compose network.

  validator:
    image: validator:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: validator
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./deploy/env/validator.env
        required: true
    environment:
      BASE_ROLE: validator
      BASE_LISTEN: 0.0.0.0:8080
      # Optional co-located gateway (only present under profile master)
      BASE_GATEWAY_ENDPOINT: ${BASE_GATEWAY_ENDPOINT:-http://gateway:8080}
      # Owner-signed measurements for attest (image bakes /etc/base/config; host mount wins)
      BASE_TRUST_ROOT_DIR: ${BASE_TRUST_ROOT_DIR:-/etc/base/config}
    volumes:
      - ./config:/etc/base/config:ro
      - base-validator-lkg:/var/lib/base
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -m 5 http://127.0.0.1:8080/healthz || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - base
    # No docker.sock — updater talks via socket-proxy only.

  gateway:
    profiles: ["master"]
    image: gateway:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: gateway
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./deploy/env/gateway.env
        required: true
    environment:
      BASE_ROLE: gateway
      BASE_GATEWAY_LISTEN: 0.0.0.0:8080
      BASE_TRUST_ROOT_DIR: ${BASE_TRUST_ROOT_DIR:-/etc/base/config}
      # Bundle seal mini-secret (host file, never baked into image)
      BASE_GATEWAY_SK_FILE: ${BASE_GATEWAY_SK_FILE:-/run/secrets/gateway_sk}
    volumes:
      - ./config:/etc/base/config:ro
      - ./deploy/secrets/gateway_sk:/run/secrets/gateway_sk:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      # The gateway resolves the subnet owner from chain before it listens.
      start_period: 30s
    networks:
      - base

  # ---------------------------------------------------------------------------
  # TEST-ONLY adversarial gateway (task 48). NEVER on default or master path.
  # Enable explicitly:
  #   docker compose --profile evil-gateway up -d evil-gateway
  # Do NOT use in production. Staging offline proofs live in
  # crates/validator/src/adversarial_tests.rs (FakeChain / wiremock).
  # ---------------------------------------------------------------------------
  evil-gateway:
    profiles: ["evil-gateway"]
    image: gateway:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: gateway
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    # Test harness — no auto-restart loop that could look like prod.
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./deploy/env/gateway.env
        required: false
    environment:
      BASE_ROLE: gateway
      BASE_GATEWAY_LISTEN: 0.0.0.0:8080
      # Marker so operators never confuse with prod gateway (master profile).
      BASE_EVIL_GATEWAY: "1"
      BASE_EVIL_SCENARIO: ${BASE_EVIL_SCENARIO:-inconsistent-vector}
    expose:
      - "8080"
    networks:
      - base

  updater:
    image: updater:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: updater
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    # The updater pulls its desired image from a registry, so it is only useful
    # when BASE_UPDATER_DESIRED_IMAGE is a registry reference. remote-deploy.sh
    # enables this profile automatically in that case.
    profiles: ["auto-update"]
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_started
      validator:
        condition: service_started
    env_file:
      - path: ./deploy/env/updater.env
        required: true
    environment:
      BASE_UPDATER_PROXY_URL: http://socket-proxy:2375
      BASE_UPDATER_COMPOSE_PROJECT: base
      BASE_UPDATER_SERVICE_NAME: validator
      BASE_UPDATER_HEALTH_URL: http://validator:8080/readyz
      BASE_UPDATER_STATE_DIR: /var/lib/base-updater
      BASE_UPDATER_SELF_NAME: base-updater-1
    volumes:
      - base-updater-state:/var/lib/base-updater
    networks:
      - base
    # Talks to Docker Engine only through socket-proxy (allowlisted).



  # ---------------------------------------------------------------------------
  # relearn-challenge — Relearn LLM post-training factory (:8095).
  # Miner pays Lium (BYOK). Control plane rents a digest-pinned eval image.
  # ---------------------------------------------------------------------------
  relearn-challenge:
    image: relearn-challenge:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: relearn-challenge
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8095
      BASE_CHALLENGE_SK_FILE: /run/base/challenge_sk
      # Sim eval unless a miner BYOK key is presented. Never log LIUM_API_KEY.
      RELEARN_FORCE_SIM: "${RELEARN_FORCE_SIM:-false}"
      RELEARN_PIN_FILE: /etc/base/config/relearn-pin.toml
      RELEARN_TEACHER_BACKEND: "${RELEARN_TEACHER_BACKEND:-http_api}"
      RELEARN_TEACHER_API_URL: "${RELEARN_TEACHER_API_URL:-}"
      RELEARN_TEACHER_MODEL: "${RELEARN_TEACHER_MODEL:-}"
      RELEARN_TEACHER_LOCAL_DIR: "${RELEARN_TEACHER_LOCAL_DIR:-}"
      RELEARN_HOLDOUT_FILE: /run/base/relearn/holdout.json
      RELEARN_ADMIN_TOKENS_FILE: /run/base/relearn/admin_tokens
      BASE_CHALLENGE_GATEWAY_ENDPOINT: ${BASE_CHALLENGE_GATEWAY_ENDPOINT:-http://gateway:8080}
    env_file:
      - path: ./deploy/env/relearn-challenge.env
        required: true
    volumes:
      - ./config:/etc/base/config:ro
      - ./deploy/secrets/relearn_sk:/run/base/challenge_sk:ro
      - ./deploy/secrets/lium:/run/base/lium:ro
      - ./deploy/secrets/relearn:/run/base/relearn:ro
      - relearn-artifacts:/var/lib/relearn
    expose:
      - "8095"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -m 5 http://127.0.0.1:8095/health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - base

  # ---------------------------------------------------------------------------
  # relearn-t2i-challenge — Relearn Image (`relearn-image`, :8097). Miners
  # fine-tune the pinned Cosmos3 generator; Q-Judger scores frozen prompt
  # cells. The service keeps the pre-launch `t2i` spelling (docs/NAMING.md);
  # the challenge id on the wire is `relearn-image`. The holdout prompt records
  # are an operator secret, mounted read-only from deploy/secrets.
  # ---------------------------------------------------------------------------
  relearn-t2i-challenge:
    image: relearn-t2i-challenge:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: relearn-t2i-challenge
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8097
      BASE_CHALLENGE_SK_FILE: /run/base/challenge_sk
      # Sim eval unless a judge endpoint is configured. Never log the key.
      RELEARN_T2I_FORCE_SIM: "${RELEARN_T2I_FORCE_SIM:-false}"
      RELEARN_T2I_PIN_FILE: /etc/base/config/relearn-t2i-pin.toml
      RELEARN_T2I_JUDGE_BACKEND: "${RELEARN_T2I_JUDGE_BACKEND:-http_api}"
      RELEARN_T2I_JUDGE_API_URL: "${RELEARN_T2I_JUDGE_API_URL:-}"
      RELEARN_T2I_HOLDOUT_FILE: /run/base/relearn-t2i/holdout.json
      RELEARN_T2I_ADMIN_TOKENS_FILE: /run/base/relearn-t2i/admin_tokens
      # Base checkpoint measured by the pinned eval image. A live host refuses
      # every submission until this exists (GET /v1/status).
      RELEARN_T2I_BASE_CHAMPION_FILE: /run/base/relearn-t2i/base_champion.json
      BASE_CHALLENGE_GATEWAY_ENDPOINT: ${BASE_CHALLENGE_GATEWAY_ENDPOINT:-http://gateway:8080}
    env_file:
      - path: ./deploy/env/relearn-t2i-challenge.env
        required: true
    volumes:
      - ./config:/etc/base/config:ro
      - ./deploy/secrets/relearn_t2i_sk:/run/base/challenge_sk:ro
      - ./deploy/secrets/lium:/run/base/lium:ro
      - ./deploy/secrets/relearn-t2i:/run/base/relearn-t2i:ro
      - relearn-t2i-artifacts:/var/lib/relearn-t2i
    expose:
      - "8097"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -m 5 http://127.0.0.1:8097/health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - base

  # ---------------------------------------------------------------------------
  # relearn-agent-challenge — Relearn Agent (:8099). Miners post-train the same
  # Qwen3.8-27B checkpoint as `relearn` into an agent, and the eval replays the
  # emitted tool traces: a model that answers without touching the tools or the
  # observation fails the ablation arms. Episodes are an operator secret,
  # mounted read-only from deploy/secrets.
  # ---------------------------------------------------------------------------
  relearn-agent-challenge:
    image: relearn-agent-challenge:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: relearn-agent-challenge
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8099
      BASE_CHALLENGE_SK_FILE: /run/base/challenge_sk
      # Sim eval unless the operator opts in. Never log LIUM_API_KEY.
      RELEARN_AGENT_FORCE_SIM: "${RELEARN_AGENT_FORCE_SIM:-false}"
      RELEARN_AGENT_PIN_FILE: /etc/base/config/relearn-agent-pin.toml
      RELEARN_AGENT_HOLDOUT_FILE: /run/base/relearn-agent/episodes.json
      RELEARN_AGENT_ADMIN_TOKENS_FILE: /run/base/relearn-agent/admin_tokens
      RELEARN_AGENT_BASE_CHAMPION_FILE: /run/base/relearn-agent/base_champion.json
      BASE_CHALLENGE_GATEWAY_ENDPOINT: ${BASE_CHALLENGE_GATEWAY_ENDPOINT:-http://gateway:8080}
    env_file:
      - path: ./deploy/env/relearn-agent-challenge.env
        required: true
    volumes:
      - ./config:/etc/base/config:ro
      - ./deploy/secrets/relearn_agent_sk:/run/base/challenge_sk:ro
      - ./deploy/secrets/lium:/run/base/lium:ro
      - ./deploy/secrets/relearn-agent:/run/base/relearn-agent:ro
      - relearn-agent-artifacts:/var/lib/relearn-agent
    expose:
      - "8099"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -m 5 http://127.0.0.1:8099/health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - base

  # ---------------------------------------------------------------------------
  # relearn-mm-challenge — Relearn Multimodal (:8098). OFF: it has no row in
  # config/challenges.toml, so it has no emission and no leaf of its can
  # verify. Kept behind the `mm` profile so the code stays exercised and the
  # challenge can be turned on with a trust-root ceremony rather than a
  # rewrite. Never enable it on a prod host.
  # ---------------------------------------------------------------------------
  relearn-mm-challenge:
    profiles: ["mm"]
    image: relearn-mm-challenge:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: relearn-mm-challenge
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8098
      BASE_CHALLENGE_SK_FILE: /run/base/challenge_sk
      RELEARN_MM_FORCE_SIM: "${RELEARN_MM_FORCE_SIM:-false}"
      RELEARN_MM_PIN_FILE: /etc/base/config/relearn-mm-pin.toml
      RELEARN_MM_CHAMPION_LM_HASH: "${RELEARN_MM_CHAMPION_LM_HASH:-}"
      RELEARN_MM_ADMIN_TOKENS_FILE: /run/base/relearn-mm/admin_tokens
      BASE_CHALLENGE_GATEWAY_ENDPOINT: ${BASE_CHALLENGE_GATEWAY_ENDPOINT:-http://gateway:8080}
    env_file:
      - path: ./deploy/env/relearn-mm-challenge.env
        required: true
    volumes:
      - ./config:/etc/base/config:ro
      - ./deploy/secrets/relearn_mm_sk:/run/base/challenge_sk:ro
      - ./deploy/secrets/lium:/run/base/lium:ro
      - ./deploy/secrets/relearn-mm:/run/base/relearn-mm:ro
      - relearn-mm-artifacts:/var/lib/relearn-mm
    expose:
      - "8098"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -m 5 http://127.0.0.1:8098/health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - base

  # bounty-challenge — bug-report challenge (:8096). Pair + reports; Chat inject env-only.
  bounty-challenge:
    image: bounty-challenge:0.1.0
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: bounty-challenge
      args:
        BUILD_FROM: ${BASE_DOCKER_BUILD_FROM:-prebuilt}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8096
      BASE_CHALLENGE_SK_FILE: /run/base/challenge_sk
      BOUNTY_CHAT_COMMAND: "${BOUNTY_CHAT_COMMAND:-}"
      # The only scorer. Empty → ingest 503s and no leaf is signed.
      BOUNTY_BACKEND_PUBLIC_URL: "${BOUNTY_BACKEND_PUBLIC_URL:-}"
      BOUNTY_EMIT_POLL_SECS: "${BOUNTY_EMIT_POLL_SECS:-120}"
      BOUNTY_ADMIN_TOKENS_FILE: /run/base/bounty/admin_tokens
      BOUNTY_SESSION_SECRET_FILE: /run/base/bounty/session_secret
      # Emission posts signed leaves to the gateway that seals what validators
      # fetch. `BASE_NETUID` (expected set `E`) comes from the env file and the
      # chain endpoints from the env overlay.
      BASE_CHALLENGE_GATEWAY_ENDPOINT: ${BASE_CHALLENGE_GATEWAY_ENDPOINT:-http://gateway:8080}
    env_file:
      - path: ./deploy/env/bounty-challenge.env
        required: true
    volumes:
      - ./config:/etc/base/config:ro
      - ./deploy/secrets/bounty_sk:/run/base/challenge_sk:ro
      - ./deploy/secrets/lium:/run/base/lium:ro
      - ./deploy/secrets/bounty:/run/base/bounty:ro
    expose:
      - "8096"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -m 5 http://127.0.0.1:8096/health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - base

  socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    environment:
      # Shared proxy: updater rolls. App-level
      # Allowlist::updater / Allowlist::verifier enforce method/path; tecnativa
      # CONTAINERS includes DELETE for sandbox cleanup. NETWORKS stays off —
      # design-sandbox-egress is pre-created by compose (NetworkMode by name).
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "1"
      # Everything else denied (explicit zeros for clarity)
      ALLOW_START: "1"
      ALLOW_STOP: "1"
      ALLOW_RESTARTS: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EVENTS: "1"
      EXEC: "0"
      INFO: "0"
      NETWORKS: "0"
      NODES: "0"
      PLUGINS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      SECRETS: "0"
      VOLUMES: "0"
    volumes:
      # Sole host docker.sock mount on this stack (read-only).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - base
    # Bound only on the internal network — never publish 2375 to the host.

volumes:
  base-pgdata:
  base-updater-state:
  base-validator-lkg:
  relearn-artifacts:
  relearn-t2i-artifacts:
  relearn-agent-artifacts:
  relearn-mm-artifacts:

networks:
  base:
    driver: bridge
