version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bounty
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bounty-service:
    build: ./services/bounty
    ports:
      - "8095:8095"
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/bounty
      OPENROUTER_API_KEY: your_openrouter_key
    depends_on:
      - postgres

volumes:
  pgdata:
