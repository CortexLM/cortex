name: ci

# Pushes to main run this through images.yml, which publishes only after it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - run: bash scripts/check.sh

  # The supervisor canary: server image, Cortex flags, no secrets then mounted secrets.
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f docker/Dockerfile.server -t hypertrain:local .
      - run: ENGINE=docker bash scripts/canary.sh
      - run: docker build -f docker/Dockerfile.gpu -t hypertrain-gpu:ci .
      - run: docker run --rm hypertrain-gpu:ci --help
