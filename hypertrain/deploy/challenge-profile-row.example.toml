# Example row for the challenge profile (config/challenges.toml in CortexLM/cortex, served by the
# gateway at GET /v1/trust). Add it to the profile, rebalance every share so the sum is exactly
# 10000, bump `version`, restart the master. public_key is the hypertrain LEAF key from
# `cortex keygen`; its seed lives only at deploy/secrets/master/hypertrain.key on the master,
# never in the container.

[[challenges]]
id = "hypertrain"
public_key = "REPLACE_WITH_64_HEX_LEAF_PUBLIC_KEY"
emission_share_bps = 0
policy = "all_metagraph_hotkeys"
