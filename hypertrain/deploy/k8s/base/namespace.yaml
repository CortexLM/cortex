apiVersion: v1
kind: Namespace
metadata:
  name: hypertrain-relay
  labels:
    hypertrain.network/role: relay
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: relay-budget
spec:
  hard:
    pods: "12"
    requests.cpu: "2"
    limits.cpu: "6"
    requests.memory: 2Gi
    limits.memory: 6Gi
    requests.ephemeral-storage: 12Gi
    limits.ephemeral-storage: 18Gi
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
    services.nodeports: "0"
