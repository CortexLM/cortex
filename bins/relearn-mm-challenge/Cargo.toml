[package]
name = "relearn-mm-challenge-bin"
description = "relearn-mm-challenge operator binary (health + miner submit on :8098)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "relearn-mm-challenge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
challenge-keys = { path = "../../crates/challenge-keys" }
clap = { version = "4", features = ["derive", "env"] }
relearn-mm-challenge = { path = "../../crates/relearn-mm-challenge" }
relearn-mm-eval = { path = "../../crates/relearn-mm-eval" }
relearn-mm-task = { path = "../../crates/relearn-mm-task" }
telemetry = { path = "../../crates/telemetry" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"

[lints]
workspace = true
