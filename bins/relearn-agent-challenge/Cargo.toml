[package]
name = "relearn-agent-challenge-bin"
description = "relearn-agent challenge operator binary (health + miner submit on :8099)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "relearn-agent-challenge"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
challenge-keys = { path = "../../crates/challenge-keys" }
clap = { version = "4", features = ["derive", "env"] }
harvest-pod = { path = "../../crates/harvest-pod" }
prism-lium = { path = "../../crates/prism-lium" }
relearn-agent-challenge = { path = "../../crates/relearn-agent-challenge" }
relearn-agent-harvest = { path = "../../crates/relearn-agent-harvest" }
telemetry = { path = "../../crates/telemetry" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"

[lints]
workspace = true
