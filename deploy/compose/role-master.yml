# Standalone master role; activate only on the master droplet with --profile master.
name: cortex-master
services:
  gateway:
    profiles: [master]
    image: ${CORTEX_IMAGE:?Set the published image repository@sha256:digest}
    command: [master, --bind, 0.0.0.0, --port, "8080"]
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 125m
    env_file:
      - path: ${BASE_MASTER_ENV_FILE:-deploy/env/master.env}
        required: true
    environment:
      BASE_STATE_DIR: /var/lib/base
      BASE_OWNER_PUBKEY_FILE: /etc/base/config/owner.pubkey
      BASE_CHALLENGES_FILE: /etc/base/config/challenges.toml
      BASE_MEASUREMENTS_FILE: /etc/base/config/measurements.toml
      BASE_GATEWAY_SK_FILE: /run/secrets/gateway.key
      PROOF_SK_FILE: /run/secrets/proof.key
      BASE_GATEWAY_ADMIN_TOKEN_FILE: /run/secrets/operator.token
      BASE_CHALLENGE_KEYS_DIR: /run/secrets
      BASE_CHALLENGE_REGISTRY_FILE: /etc/base/challenges/registry.toml
      BASE_CHALLENGE_SECRETS_DIR: /run/challenge-secrets
    ports:
      - "${BASE_GATEWAY_BIND_ADDRESS:?Set the master VPC address}:8080:8080"
    volumes:
      - type: bind
        source: ${BASE_TRUST_ROOT_DIR:-config}
        target: /etc/base/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BASE_MASTER_SECRETS_DIR:-deploy/secrets/master}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BASE_CHALLENGE_REGISTRY_DIR:-deploy/challenges}
        target: /etc/base/challenges
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BASE_CHALLENGE_SECRETS_HOST_DIR:?Set the absolute host directory of challenge secrets}
        target: /run/challenge-secrets
        read_only: true
        bind:
          create_host_path: false
      - base-master-state:/var/lib/base
    networks:
      default: {}
      challenges:
        aliases: [cortex-master]
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  # The only service with Docker control: pulls, verifies, canaries and updates
  # challenge containers listed in the registry. It never reads a secret.
  challenge-supervisor:
    profiles: [master]
    image: ${CORTEX_IMAGE:?Set the published image repository@sha256:digest}
    command:
      - challenge-supervisor
      - --registry
      - /etc/base/challenges/registry.toml
      - --secrets-host-dir
      - ${BASE_CHALLENGE_SECRETS_HOST_DIR:?Set the absolute host directory of challenge secrets}
      - --network
      - cortex-challenges
      - --master-url
      - http://cortex-master:8080
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    group_add: ["${BASE_DOCKER_GID:?Set the host docker group id}"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BASE_CHALLENGE_REGISTRY_DIR:-deploy/challenges}
        target: /etc/base/challenges
        read_only: true
        bind:
          create_host_path: false
    networks: [challenges]
    tmpfs:
      - /tmp:size=16m,mode=1777
volumes:
  base-master-state:
networks:
  challenges:
    name: cortex-challenges
