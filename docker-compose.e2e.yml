# Cleartext e2e — publish HTTP on host (no Cloudflare/TLS).
# BASE_CHAIN_BACKEND=fake_owner for gateway master check.
services:
  gateway:
    ports:
      - "8088:8080"
    environment:
      BASE_CHAIN_BACKEND: fake_owner
      BASE_ROLE: gateway
  validator:
    ports:
      - "8089:8080"
    environment:
      BASE_ROLE: validator
  proof-challenge:
    ports:
      - "8100:8100"
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8100
      PROOF_FORCE_SIM: "true"
  bounty-challenge:
    ports:
      - "8096:8096"
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8096
      # Bounty has no offline scorer: with no feed this service serves
      # /health and /v1/status, and answers 503 on ingest.
      BOUNTY_BACKEND_PUBLIC_URL: "${BOUNTY_BACKEND_PUBLIC_URL:-}"
  socket-proxy:
    ports:
      - "2375:2375"
