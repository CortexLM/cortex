# Cleartext e2e — publish HTTP on host (no Cloudflare/TLS).
# BASE_CHAIN_BACKEND=fake_owner for gateway master check.
services:
  gateway:
    ports:
      - "8088:8080"
    environment:
      BASE_CHAIN_BACKEND: fake_owner
      BASE_ROLE: gateway
  validator:
    ports:
      - "8089:8080"
    environment:
      BASE_ROLE: validator
  relearn-challenge:
    ports:
      - "8095:8095"
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8095
      RELEARN_FORCE_SIM: "true"
  bounty-challenge:
    ports:
      - "8096:8096"
    environment:
      BASE_CHALLENGE_BIND: 0.0.0.0:8096
  socket-proxy:
    ports:
      - "2375:2375"
