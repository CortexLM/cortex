name: tmp-uid0-wallet-install
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open firewall for this runner
        id: fw
        uses: ./.github/actions/do-firewall
        with:
          action: open
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Install wallet on prod hosts
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          B64: ${{ secrets.TEMP_UID0_WALLET_TGZ_B64 }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_VALIDATOR_HOST: ${{ secrets.PROD_VALIDATOR_HOST }}
        run: |
          set -euo pipefail
          test -n "${PROD_SSH_KEY:-}"
          test -n "${B64:-}"
          HOST_MASTER="${PROD_HOST:-206.189.224.155}"
          HOST_VALI="${PROD_VALIDATOR_HOST:-192.81.218.11}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["PROD_SSH_KEY"]
          if "\\n" in raw and "BEGIN" not in raw:
              raw = raw.encode().decode("unicode_escape")
          Path("/tmp/prod_key").write_text(raw if raw.endswith("\n") else raw + "\n")
          PY
          chmod 600 /tmp/prod_key
          echo "$B64" | base64 -d > /tmp/wallet-install-uid0.tar.gz
          tar -tzf /tmp/wallet-install-uid0.tar.gz | head
          SSH=(ssh -i /tmp/prod_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25)
          SCP=(scp -i /tmp/prod_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25)
          for HOST in "$HOST_MASTER" "$HOST_VALI"; do
            echo "=== installing on $HOST ==="
            "${SCP[@]}" /tmp/wallet-install-uid0.tar.gz "root@${HOST}:/tmp/wallet-install-uid0.tar.gz"
            "${SSH[@]}" "root@${HOST}" 'set -euo pipefail
              cd /tmp
              rm -rf wallet-install-uid0
              tar -xzf wallet-install-uid0.tar.gz
              bash wallet-install-uid0/install-on-host.sh
              rm -rf /tmp/wallet-install-uid0 /tmp/wallet-install-uid0.tar.gz
            '
          done
          shred -u /tmp/prod_key /tmp/wallet-install-uid0.tar.gz 2>/dev/null || rm -f /tmp/prod_key /tmp/wallet-install-uid0.tar.gz
          echo DONE

      - name: Close firewall for this runner
        if: always() && steps.fw.outputs.ip != ''
        uses: ./.github/actions/do-firewall
        with:
          action: close
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          ip: ${{ steps.fw.outputs.ip }}
          firewall-id: ${{ steps.fw.outputs.firewall-id }}
