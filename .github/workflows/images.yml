name: images

# Build service images, push by commit SHA + branch tag, record digests as an artifact.
# Digests-only pins are consumed by deploy/scripts/promote.sh.
# After merge: promote pin services into deploy/pins/prod.json and publish the
# result as the `prod-pins-<sha>` artifact that deploy-prod.yml consumes.
# Nothing is pushed to main: main is protected (PR + Greptile review required),
# so a pin commit from CI is rejected with GH013. Service images use GHCR.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "bins/**"
      - "deploy/Dockerfile"
      - "deploy/attest-helper/**"
      # Ops scripts (promote/remote-deploy/burn-seal) — keep the
      # digest → prod-pin ladder reachable for ops-only commits.
      - "deploy/scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push-digests:
    name: build · push · record digests
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: validator
            image_suffix: validator
            dockerfile: deploy/Dockerfile
          - target: gateway
            image_suffix: gateway
            dockerfile: deploy/Dockerfile
          - target: updater
            image_suffix: updater
            dockerfile: deploy/Dockerfile
          - target: bounty-challenge
            image_suffix: bounty-challenge
            dockerfile: deploy/Dockerfile
          - target: proof-challenge
            image_suffix: proof-challenge
            dockerfile: deploy/Dockerfile
          - target: ""
            image_suffix: base-attest-helper
            dockerfile: deploy/attest-helper/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase GHCR image prefix
        run: |
          set -euo pipefail
          # GHCR rejects mixed-case repository paths (e.g. BaseIntelligence).
          owner_repo="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_PREFIX=ghcr.io/${owner_repo}" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/${owner_repo}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image_suffix == 'base-attest-helper' && 'deploy/attest-helper' || '.' }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image_suffix }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image_suffix }}:${{ github.ref_name }}
          build-args: |
            BUILD_FROM=source
          provenance: false

      - name: Write digest fragment
        run: |
          set -euo pipefail
          mkdir -p digests-out
          DIGEST="${{ steps.build.outputs.digest }}"
          test -n "$DIGEST"
          test "${DIGEST#sha256:}" != "$DIGEST"
          REPO="${{ env.IMAGE_PREFIX }}/${{ matrix.image_suffix }}"
          SVC="${{ matrix.image_suffix }}"
          cat > "digests-out/${SVC}.json" <<EOF
          {
            "service": "${SVC}",
            "repository": "${REPO}",
            "tag_sha": "${{ github.sha }}",
            "digest": "${DIGEST}",
            "image": "${REPO}@${DIGEST}",
            "commit_sha": "${{ github.sha }}"
          }
          EOF
          cat "digests-out/${SVC}.json"

      - name: Upload digest fragment
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image_suffix }}
          path: digests-out/${{ matrix.image_suffix }}.json
          if-no-files-found: error

  merge-digests:
    name: merge digest manifest
    needs: build-push-digests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download fragments
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests-in
          merge-multiple: true

      - name: Merge + validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, os
          from datetime import datetime, timezone
          root = pathlib.Path("digests-in")
          images = {}
          for p in sorted(root.glob("*.json")):
              d = json.loads(p.read_text())
              assert d["digest"].startswith("sha256:") and len(d["digest"]) == 71
              assert "@sha256:" in d["image"]
              images[d["service"]] = d
          expected = {
              "validator",
              "gateway",
              "updater",
              "bounty-challenge",
              "proof-challenge",
              "base-attest-helper",
          }
          assert set(images) == expected, (set(images), expected)
          out = {
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "created_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "registry": "ghcr.io",
              "images": images,
          }
          pathlib.Path("deploy/digests").mkdir(parents=True, exist_ok=True)
          path = pathlib.Path("deploy/digests") / f"{out['commit_sha']}.json"
          path.write_text(json.dumps(out, indent=2, sort_keys=True) + "\n")
          print(path.read_text())
          PY

      - name: Upload merged digests
        uses: actions/upload-artifact@v4
        with:
          name: base-image-digests-${{ github.sha }}
          path: deploy/digests/${{ github.sha }}.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Digest → prod pin ladder. Writes deploy/digests/<sha>.json and promotes the
  # pin services into deploy/pins/prod.json, then publishes both as the
  # `prod-pins-<sha>` artifact. deploy-prod.yml downloads that artifact instead
  # of reading pins from git: main is protected, so CI cannot push a pin commit.
  # ---------------------------------------------------------------------------
  prod-pins:
    name: record prod pins
    needs: merge-digests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download merged digests
        uses: actions/download-artifact@v4
        with:
          name: base-image-digests-${{ github.sha }}
          path: /tmp/digests-in

      - name: Record digests + promote prod pins
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          mkdir -p deploy/digests
          # Artifact may be the file itself or nested under deploy/digests/
          SRC=""
          if [[ -f "/tmp/digests-in/${SHA}.json" ]]; then
            SRC="/tmp/digests-in/${SHA}.json"
          elif [[ -f "/tmp/digests-in/deploy/digests/${SHA}.json" ]]; then
            SRC="/tmp/digests-in/deploy/digests/${SHA}.json"
          else
            SRC=$(find /tmp/digests-in -name "${SHA}.json" -type f | head -1)
          fi
          test -n "$SRC" && test -f "$SRC"
          cp "$SRC" "deploy/digests/${SHA}.json"
          echo "Recorded digest manifest: deploy/digests/${SHA}.json"
          chmod +x deploy/scripts/promote.sh
          # --force-prod skips the staging-digest ladder check: the staging soak
          # was retired, so deploy/pins/staging.json is no longer written by any
          # workflow and comparing against it would pin prod to a dead lane.
          # --skip-backup: this job only records pins into an artifact and never
          # deploys; the fail-closed Postgres backup runs in deploy-prod.yml.
          for svc in validator gateway updater bounty-challenge proof-challenge; do
            IMAGE=$(python3 -c '
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(d["images"][sys.argv[2]]["image"])
          ' "deploy/digests/${SHA}.json" "$svc")
            echo "prod pin $svc → $IMAGE"
            ./deploy/scripts/promote.sh \
              --env prod \
              --service "$svc" \
              --image "$IMAGE" \
              --confirm-prod \
              --force-prod \
              --commit "$SHA" \
              --skip-backup
          done
          python3 -c '
          import json, sys
          p = json.load(open("deploy/pins/prod.json"))
          assert p["commit_sha"] == sys.argv[1], (p["commit_sha"], sys.argv[1])
          for s in ("validator", "gateway", "updater", "bounty-challenge", "proof-challenge"):
              assert s in p["services"], s
              assert p["services"][s]["digest"].startswith("sha256:")
          print("prod pins ok", p["commit_sha"])
          ' "$SHA"

      - name: Stage pins artifact
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          STAGE="/tmp/prod-pins-artifact"
          mkdir -p "$STAGE/deploy/pins" "$STAGE/deploy/digests"
          cp deploy/pins/prod.json "$STAGE/deploy/pins/prod.json"
          cp "deploy/digests/${SHA}.json" "$STAGE/deploy/digests/${SHA}.json"
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          pin = json.load(open("deploy/pins/prod.json", encoding="utf-8"))
          sha = pin["commit_sha"]
          out = [f"### prod pins for `{sha}`", "", "| service | digest |", "| --- | --- |"]
          for svc in sorted(pin["services"]):
              out.append(f"| {svc} | `{pin['services'][svc]['digest']}` |")
          out += ["", f"deploy-prod.yml consumes these as artifact `prod-pins-{sha}`."]
          print("\n".join(out))
          PY

      - name: Upload prod pins artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-pins-${{ github.sha }}
          path: /tmp/prod-pins-artifact
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Make GHCR packages public so unauthenticated / Phala pulls work. Lives here
  # rather than in ghcr-public.yml so it runs inline right after digests merge;
  # ghcr-public.yml remains for manual re-runs.
  # ---------------------------------------------------------------------------
  ghcr-public:
    needs: merge-digests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set package visibility public
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Nested image names: ghcr.io/<owner>/<repo>/<suffix> → package "<repo>/<suffix>".
          # Derive the repo segment: the hardcoded "base/" prefix went stale when
          # the repo was renamed, so every visibility call 404'd and the droplets
          # were left pulling private packages.
          repo="${GITHUB_REPOSITORY##*/}"
          repo="${repo,,}"
          pkgs=(
            "${repo}/base-attest-helper"
            "${repo}/gateway"
            "${repo}/validator"
            "${repo}/updater"
            "${repo}/bounty-challenge"
            "${repo}/proof-challenge"
          )
          ok=0
          # First list packages to Learn exact names (debug)
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${OWNER}/packages?package_type=container&per_page=100" \
            | tee /tmp/pkg-list.json | head -c 2000 || true
          echo
          for pkg in "${pkgs[@]}"; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$pkg")
            code=$(curl -sS -o "/tmp/vis-${enc}.json" -w "%{http_code}" \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${OWNER}/packages/container/${enc}/visibility" \
              -d '{"visibility":"public"}' || true)
            echo "pkg=${pkg} http=${code} body=$(head -c 200 "/tmp/vis-${enc}.json" || true)"
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then
              ok=$((ok + 1))
            fi
          done
          echo "publicized_ok=${ok}/${#pkgs[@]}"
          # Soft fail while packages may not exist yet on first base build
          if [ "$ok" -lt 1 ]; then
            echo "WARNING: no packages publicized yet (may be missing until images run)"
            exit 0
          fi
