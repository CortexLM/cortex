name: python-images

# Explicit image publication; this workflow never changes deployed pins or hosts.
on:
  workflow_dispatch:
    inputs:
      python_image:
        description: "Python 3.12 slim Bookworm image with verified @sha256 digest"
        required: true
        type: string
        default: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
      publish:
        description: "Publish the tested runtime image to GHCR (guest is validated only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: python-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate base pin and publication branch
        env:
          PYTHON_IMAGE: ${{ inputs.python_image }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 scripts/check_deploy.py --base-image "$PYTHON_IMAGE"
          if [[ "$PUBLISH" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publish images only from main." >&2
            exit 1
          fi
          printf 'IMAGE=ghcr.io/%s/python\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Require passing CI for the exact source commit
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=completed" --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main")] | length')
          test "$success" -gt 0
      - uses: docker/setup-buildx-action@v3
      - name: Build and load the runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          platforms: linux/amd64
          tags: cortex-python:test
          build-args: |
            PYTHON_IMAGE=${{ inputs.python_image }}
          cache-from: type=gha,scope=cortex-python
          cache-to: type=gha,mode=max,scope=cortex-python
      - name: Exercise installed runtime
        run: |
          docker run --rm --network none --read-only --cap-drop ALL cortex-python:test --help
          docker run --rm --network none --read-only --cap-drop ALL cortex-python:test validator --help
          docker run --rm --network none --read-only --cap-drop ALL cortex-python:test vm-host --help
          docker run --rm --network none --read-only --cap-drop ALL --entrypoint python cortex-python:test -I -c 'import bittensor, cortex.master, cortex.vm.server; from cortex.protocol.crypto import public_key, sign_raw, verify_raw; key = bytes(range(32)); assert verify_raw(public_key(key), b"smoke", b"container", sign_raw(key, b"smoke", b"container"))'
      - name: Build and load the guest for validation only
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: guest
          load: true
          platforms: linux/amd64
          tags: cortex-python-guest:test
          build-args: |
            PYTHON_IMAGE=${{ inputs.python_image }}
          cache-from: |
            type=gha,scope=cortex-python-guest
            type=gha,scope=cortex-python
          cache-to: type=gha,mode=max,scope=cortex-python-guest
      - name: Check guest imports and native dependencies without booting init
        run: |
          docker run --rm -i --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --entrypoint /opt/cortex/bin/python cortex-python-guest:test -I -B - <<'PYTHON'
          import ctypes
          import ctypes.util
          import importlib
          import os
          import pathlib
          import shutil
          import subprocess

          for module in ("cortex.vm.init", "cortex.vm.guest_server", "cortex.vm.candidate", "cortex.rlm"):
              importlib.import_module(module)
          init = pathlib.Path("/sbin/init")
          assert init.resolve() == pathlib.Path("/opt/cortex/bin/proof-guest-init")
          assert init.is_file() and os.access(init, os.X_OK), "guest init is not executable"
          for name in ("sodium", "seccomp"):
              library = ctypes.util.find_library(name)
              assert library, f"missing guest library: {name}"
              ctypes.CDLL(library)
          for binary, version_option in (("bwrap", "--version"), ("prlimit", "--version"), ("ip", "-Version"), ("tini", "--version")):
              executable = shutil.which(binary)
              assert executable, f"missing guest executable: {binary}"
              subprocess.run([executable, version_option], check=True, timeout=5, capture_output=True)
          from cortex.protocol.crypto import public_key, sign_raw, verify_raw

          key = bytes(range(32))
          assert verify_raw(public_key(key), b"smoke", b"guest", sign_raw(key, b"smoke", b"guest"))
          print("Guest imports, init entry point and native dependencies verified; no VM boot performed.")
          PYTHON
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image and record its digest
        if: inputs.publish
        run: |
          docker tag cortex-python:test "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          image_digest=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          IMAGE_DIGEST="$image_digest" python3 - <<'PYTHON'
          import json, os, pathlib, re
          image = os.environ["IMAGE_DIGEST"]
          if not re.fullmatch(re.escape(os.environ["IMAGE"]) + r"@sha256:[0-9a-f]{64}", image):
              raise SystemExit("registry did not return a valid digest")
          pathlib.Path("image.json").write_text(json.dumps({"image": image, "commit": os.environ["GITHUB_SHA"]}, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write("Published runtime: `" + image + "`\n")
          PYTHON
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: python-image-${{ github.sha }}
          path: image.json
          if-no-files-found: error
          retention-days: 90
