# Make GHCR container packages public so unauthenticated droplet pulls work.
# Packages live under the repo path: ghcr.io/<owner>/<repo>/<suffix>.
# Prod deploys pull digests anonymously (remote-deploy.sh --build-from registry
# never logs in), so a private package is a broken prod deploy.
name: ghcr-public

# Manual re-run only. The automatic pass is the `ghcr-public` job in
# images.yml, which runs on every push to main that rebuilds images.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  set-public:
    runs-on: ubuntu-latest
    steps:
      - name: Set package visibility public
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Nested image names: ghcr.io/<owner>/<repo>/<suffix> → package "<repo>/<suffix>".
          # Derive the repo segment: the hardcoded "base/" prefix went stale when
          # the repo was renamed, so every visibility call 404'd and the droplets
          # were left pulling private packages.
          repo="${GITHUB_REPOSITORY##*/}"
          repo="${repo,,}"
          pkgs=(
            "${repo}/base-attest-helper"
            "${repo}/gateway"
            "${repo}/validator"
            "${repo}/updater"
            "${repo}/bounty-challenge"
            "${repo}/proof-challenge"
          )
          ok=0
          # First list packages to Learn exact names (debug)
          curl -sS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${OWNER}/packages?package_type=container&per_page=100" \
            | tee /tmp/pkg-list.json | head -c 2000 || true
          echo
          for pkg in "${pkgs[@]}"; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$pkg")
            code=$(curl -sS -o "/tmp/vis-${enc}.json" -w "%{http_code}" \
              -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/orgs/${OWNER}/packages/container/${enc}/visibility" \
              -d '{"visibility":"public"}' || true)
            echo "pkg=${pkg} http=${code} body=$(head -c 200 /tmp/vis-${enc}.json || true)"
            if [ "$code" = "204" ] || [ "$code" = "200" ]; then
              ok=$((ok + 1))
            fi
          done
          echo "publicized_ok=${ok}/${#pkgs[@]}"
          # Soft fail while packages may not exist yet on first base build
          if [ "$ok" -lt 1 ]; then
            echo "WARNING: no packages publicized yet (may be missing until images run)"
            exit 0
          fi
