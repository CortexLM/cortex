name: deploy-prod

# Promote digest-pinned images to prod droplets.
#
# The DigitalOcean staging soak was retired (owner decision, 2026-09-10): there
# is no staging deploy lane and no staging pin file to match against. Every
# green `images` run on main deploys prod, and version tags / manual dispatch
# remain available for re-deploys and rollbacks.
#
# Triggers:
#   - workflow_run: `images` completed successfully on main (the normal path)
#   - push tag v*.*.* (cut from main)
#   - workflow_dispatch with an explicit commit_sha (rollback = an older SHA)
#
# Steps:
#   1. Preflight — the SHA is on origin/main, CI is green for it, and the
#      `images` run for that SHA published a `prod-pins-<sha>` artifact.
#   2. Fail-closed Postgres backup to DO Spaces.
#   3. Deploy master + validator with remote-deploy.sh --build-from registry
#      (GHCR digest pull + retag; no Rust compile on the droplet).
#   4. Smoke /healthz (fail-closed).
#
# Prod pins are never committed: main is protected (PR + Greptile review), so a
# pin commit from CI is rejected with GH013. deploy/pins/prod.json in git is a
# template — the deployed pins are the `prod-pins-<sha>` artifact built by
# images.yml from the GHCR digests of that exact commit.

on:
  workflow_run:
    workflows: [images]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA on main to deploy (defaults to the ref's SHA)"
        required: false

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight checks
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      images_run_id: ${{ steps.images.outputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit SHA
        id: resolve
        env:
          INPUT_SHA: ${{ github.event.inputs.commit_sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SHA:-}" ]]; then
            SHA="$INPUT_SHA"
          elif [[ -n "${RUN_SHA:-}" ]]; then
            SHA="$RUN_SHA"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            SHA=$(git rev-list -n 1 "$GITHUB_REF")
          else
            SHA="$GITHUB_SHA"
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a full commit SHA: $SHA"; exit 1; }
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved commit: $SHA"

      - name: Verify the commit is on origin/main
        run: |
          set -euo pipefail
          SHA="${{ steps.resolve.outputs.commit_sha }}"
          git fetch --quiet origin main
          # Prod only ever runs code that is merged: a tag cut off main, a stale
          # branch SHA, or a hand-typed dispatch input is refused here.
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "commit $SHA is not an ancestor of origin/main — refusing to deploy prod"
            exit 1
          fi
          echo "$SHA is on origin/main"

      - name: Wait for CI green on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.resolve.outputs.commit_sha }}"
          # images.yml and ci.yml run in parallel on a main push, so the CI run
          # for this SHA may still be going when the images run completes.
          for i in $(seq 1 60); do
            conclusion=$(gh run list \
              --workflow ci.yml \
              --commit "$SHA" \
              --status completed \
              --json conclusion \
              --jq '.[0].conclusion // empty' 2>/dev/null || true)
            case "$conclusion" in
              success) echo "CI passed for $SHA"; exit 0 ;;
              "") echo "waiting for a completed ci run on $SHA ($i/60)"; sleep 30 ;;
              *) echo "CI concluded '$conclusion' for $SHA — refusing to deploy prod"; exit 1 ;;
            esac
          done
          echo "no completed ci run for $SHA within 30 minutes — refusing to deploy prod"
          exit 1

      - name: Locate the images run that published prod pins
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          SHA="${{ steps.resolve.outputs.commit_sha }}"
          if [[ -n "${EVENT_RUN_ID:-}" ]]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID=$(gh run list \
              --workflow images.yml \
              --commit "$SHA" \
              --status success \
              --json databaseId \
              --jq '.[0].databaseId // empty' 2>/dev/null || true)
          fi
          if [[ -z "$RUN_ID" ]]; then
            echo "no successful images run for $SHA — re-run the images workflow on that commit"
            exit 1
          fi
          # Fail here rather than in the deploy job: without the artifact there
          # are no digests to pin, and prod must never fall back to a source build.
          found=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq "[.artifacts[] | select(.name == \"prod-pins-${SHA}\" and .expired == false)] | length")
          if [[ "$found" -lt 1 ]]; then
            echo "images run $RUN_ID has no live prod-pins-${SHA} artifact"
            echo "(artifacts expire — re-run images.yml for this commit to rebuild the pins)"
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "prod pins come from images run $RUN_ID"

  backup:
    name: prod pins + fail-closed backup
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download prod pins from the images run
        uses: actions/download-artifact@v4
        with:
          name: prod-pins-${{ needs.preflight.outputs.commit_sha }}
          path: /tmp/prod-pins-in
          run-id: ${{ needs.preflight.outputs.images_run_id }}
          github-token: ${{ github.token }}

      - name: Validate pins against this commit
        run: |
          set -euo pipefail
          SHA="${{ needs.preflight.outputs.commit_sha }}"
          BASE=/tmp/prod-pins-in/deploy
          test -f "$BASE/pins/prod.json" || { echo "artifact has no deploy/pins/prod.json"; find /tmp/prod-pins-in -type f; exit 1; }
          test -f "$BASE/digests/${SHA}.json" || { echo "artifact has no deploy/digests/${SHA}.json"; exit 1; }
          mkdir -p deploy/pins deploy/digests
          cp "$BASE/pins/prod.json" deploy/pins/prod.json
          cp "$BASE/digests/${SHA}.json" "deploy/digests/${SHA}.json"
          python3 - "$SHA" <<'PY'
          import json, re, sys
          sha = sys.argv[1]
          pin = json.load(open("deploy/pins/prod.json", encoding="utf-8"))
          assert pin["commit_sha"] == sha, (pin["commit_sha"], sha)
          for svc in ("validator", "gateway", "updater", "bounty-challenge", "proof-challenge"):
              digest = pin["services"][svc]["digest"]
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", digest), (svc, digest)
              hexpart = digest.split(":", 1)[1]
              assert not re.fullmatch(r"0+1?", hexpart), (svc, digest)
          print("prod pins validated for", sha)
          PY

      - name: Fail-closed — require Spaces backup credentials
        env:
          BASE_BACKUP_ENDPOINT: ${{ secrets.BASE_BACKUP_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${BASE_BACKUP_ENDPOINT:-}" ]] || missing+=("BASE_BACKUP_ENDPOINT")
          [[ -n "${AWS_ACCESS_KEY_ID:-}" ]] || missing+=("SPACES_ACCESS_KEY_ID (or AWS_ACCESS_KEY_ID)")
          [[ -n "${AWS_SECRET_ACCESS_KEY:-}" ]] || missing+=("SPACES_SECRET_ACCESS_KEY (or AWS_SECRET_ACCESS_KEY)")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Prod deploy is fail-closed: missing GitHub secrets: ${missing[*]}"
            echo "Set DO Spaces credentials before deploying prod."
            echo "See deploy/README.md § Promotion pipeline (BASE_BACKUP_ENDPOINT + Spaces keys)."
            echo "Postgres dump runs on the prod master host via SSH; Spaces upload runs here."
            exit 1
          fi
          echo "Spaces backup credentials present"

      - name: Install SSH key
        run: |
          set -euo pipefail
          KEY="${{ secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}"
          test -n "$KEY" || { echo "missing PROD_SSH_KEY (or STAGING_SSH_KEY fallback)"; exit 1; }
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy_ed25519
          chmod 600 ~/.ssh/deploy_ed25519
          echo "StrictHostKeyChecking accept-new" > ~/.ssh/config

      - name: Open firewall for this runner
        id: fw
        uses: ./.github/actions/do-firewall
        with:
          action: open
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Backup prod Postgres (SSH) → Spaces
        id: backup
        env:
          BASE_BACKUP_ENDPOINT: ${{ secrets.BASE_BACKUP_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          BASE_BACKUP_BUCKET: ${{ secrets.BASE_BACKUP_BUCKET || 'base-backups' }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'nyc3' }}
        run: |
          set -euo pipefail
          command -v aws >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq awscli; }
          HOST="root@${{ secrets.PROD_HOST }}"
          test -n "${{ secrets.PROD_HOST }}" || { echo "missing PROD_HOST"; exit 1; }
          export BASE_SSH_IDENTITY="$HOME/.ssh/deploy_ed25519"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          DUMP="/tmp/base-prod-${STAMP}.sql.gz"
          META="/tmp/base-prod-${STAMP}.meta.json"
          # Postgres is not published on the host; dump inside the container.
          ssh -i "$BASE_SSH_IDENTITY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$HOST" \
            'set -euo pipefail
             cd /opt/base
             cid=$(docker compose -f docker-compose.yml -f deploy/compose/role-master.yml -f deploy/compose/env-prod.yml ps -q postgres)
             test -n "$cid"
             docker exec "$cid" sh -c "pg_dump -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" --format=plain --no-owner --no-acl"' \
            | gzip -n > "$DUMP"
          BYTES=$(wc -c < "$DUMP")
          SUM=$(sha256sum "$DUMP" | awk '{print $1}')
          test "$BYTES" -gt 32
          python3 - "$META" "$STAMP" "$SUM" "$BYTES" <<'PY'
          import json, sys
          path, stamp, digest, nbytes = sys.argv[1:5]
          json.dump({
              "ok": True,
              "env": "prod",
              "stamp": stamp,
              "sha256": digest,
              "bytes": int(nbytes),
              "source": "ssh+docker-exec",
          }, open(path, "w"), indent=2, sort_keys=True)
          open(path, "a").write("\n")
          PY
          URI="s3://${BASE_BACKUP_BUCKET}/pg/prod/base-prod-${STAMP}.sql.gz"
          aws --endpoint-url "$BASE_BACKUP_ENDPOINT" s3 cp "$DUMP" "$URI" --only-show-errors
          aws --endpoint-url "$BASE_BACKUP_ENDPOINT" s3 cp "$META" "${URI%.sql.gz}.meta.json" --only-show-errors
          echo "backup_uri=$URI" >> "$GITHUB_OUTPUT"
          echo "Backup ok: $URI ($BYTES bytes, sha256=$SUM)"

      - name: Close firewall for this runner
        if: always() && steps.fw.outputs.ip != ''
        uses: ./.github/actions/do-firewall
        with:
          action: close
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          ip: ${{ steps.fw.outputs.ip }}
          firewall-id: ${{ steps.fw.outputs.firewall-id }}

      - name: Stage pins artifact
        run: |
          set -euo pipefail
          SHA="${{ needs.preflight.outputs.commit_sha }}"
          STAGE="/tmp/prod-pins-artifact"
          mkdir -p "$STAGE/deploy/pins" "$STAGE/deploy/digests"
          cp deploy/pins/prod.json "$STAGE/deploy/pins/prod.json"
          cp "deploy/digests/${SHA}.json" "$STAGE/deploy/digests/${SHA}.json"

      - name: Upload deployed pins artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployed-prod-pins-${{ needs.preflight.outputs.commit_sha }}
          path: /tmp/prod-pins-artifact
          if-no-files-found: error

  deploy:
    name: deploy prod ${{ matrix.role }}
    needs: [preflight, backup]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: master
            host_secret: PROD_HOST
          - role: validator
            host_secret: PROD_VALIDATOR_HOST
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}

      - name: Download deployed pins
        uses: actions/download-artifact@v4
        with:
          name: deployed-prod-pins-${{ needs.preflight.outputs.commit_sha }}
          path: /tmp/prod-pins

      - name: Install pins into tree
        run: |
          set -euo pipefail
          SHA="${{ needs.preflight.outputs.commit_sha }}"
          if [[ -f /tmp/prod-pins/deploy/pins/prod.json ]]; then
            BASE=/tmp/prod-pins/deploy
          elif [[ -f /tmp/prod-pins/pins/prod.json ]]; then
            BASE=/tmp/prod-pins
          else
            echo "unexpected artifact layout:"; find /tmp/prod-pins -type f | head -50
            exit 1
          fi
          mkdir -p deploy/pins deploy/digests
          cp "$BASE/pins/prod.json" deploy/pins/prod.json
          cp "$BASE/digests/${SHA}.json" "deploy/digests/${SHA}.json"
          python3 -c '
          import json, re
          p = json.load(open("deploy/pins/prod.json"))
          d = p["services"]["validator"]["digest"]
          h = d.split(":", 1)[-1].lower()
          assert not re.fullmatch(r"0+", h) and not re.fullmatch(r"0+1", h), d
          print("prod pins ready", p["commit_sha"])
          '

      - name: Install SSH key
        run: |
          set -euo pipefail
          KEY="${{ secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}"
          test -n "$KEY" || { echo "missing PROD_SSH_KEY (or STAGING_SSH_KEY fallback)"; exit 1; }
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy_ed25519
          chmod 600 ~/.ssh/deploy_ed25519
          echo "StrictHostKeyChecking accept-new" > ~/.ssh/config

      - name: Resolve host
        id: host
        run: |
          set -euo pipefail
          if [[ "${{ matrix.role }}" == "master" ]]; then
            h="${{ secrets.PROD_HOST }}"
          else
            h="${{ secrets.PROD_VALIDATOR_HOST }}"
          fi
          test -n "$h" || { echo "missing host secret for ${{ matrix.role }}"; exit 1; }
          echo "value=$h" >> "$GITHUB_OUTPUT"

      - name: Open firewall for this runner
        id: fw
        uses: ./.github/actions/do-firewall
        with:
          action: open
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Deploy (registry digests)
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/remote-deploy.sh
          export BASE_SSH_IDENTITY="$HOME/.ssh/deploy_ed25519"
          EXTRA=()
          if [[ "${{ matrix.role }}" == "validator" ]]; then
            if [[ -n "${{ secrets.PROD_MASTER_GATEWAY_URL }}" ]]; then
              EXTRA+=(--gateway-endpoint "${{ secrets.PROD_MASTER_GATEWAY_URL }}")
            fi
          fi
          ./deploy/scripts/remote-deploy.sh \
            --host "root@${{ steps.host.outputs.value }}" \
            --role "${{ matrix.role }}" \
            --env prod \
            --build-from registry \
            "${EXTRA[@]}"

      - name: Smoke health (fail-closed)
        run: |
          set -euo pipefail
          export BASE_SSH_IDENTITY="$HOME/.ssh/deploy_ed25519"
          HOST="root@${{ steps.host.outputs.value }}"
          ROLE="${{ matrix.role }}"
          COMPOSE="docker compose -f docker-compose.yml -f deploy/compose/role-${ROLE}.yml -f deploy/compose/env-prod.yml"
          ssh -i "$BASE_SSH_IDENTITY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$HOST" \
            "cd /opt/base && ${COMPOSE} ps --format 'table {{.Service}}\t{{.Status}}'"
          # Master has no on-chain validator (sole submitter = validator host).
          # Probe gateway on master; probe validator only on validator role.
          if [[ "$ROLE" == "master" ]]; then
            ssh -i "$BASE_SSH_IDENTITY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "$HOST" \
              "cd /opt/base && \
               if ${COMPOSE} ps --status running --services 2>/dev/null | grep -qx validator; then \
                 echo 'master smoke: ERROR validator running on master (dual submitter)'; exit 1; \
               fi; \
               for i in \$(seq 1 12); do \
                 if ${COMPOSE} exec -T gateway curl -fsS -m 5 http://127.0.0.1:8080/healthz 2>/dev/null; then \
                   echo 'gateway health: ok'; exit 0; \
                 fi; \
                 sleep 5; \
               done; \
               echo 'gateway health: FAILED'; exit 1"
          else
            ssh -i "$BASE_SSH_IDENTITY" -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              "$HOST" \
              "cd /opt/base && \
               for i in \$(seq 1 12); do \
                 if ${COMPOSE} exec -T validator curl -fsS -m 5 http://127.0.0.1:8080/healthz 2>/dev/null; then \
                   echo 'validator health: ok'; exit 0; \
                 fi; \
                 sleep 5; \
               done; \
               echo 'validator health: FAILED'; exit 1"
          fi

      - name: Close firewall for this runner
        if: always() && steps.fw.outputs.ip != ''
        uses: ./.github/actions/do-firewall
        with:
          action: close
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
          ip: ${{ steps.fw.outputs.ip }}
          firewall-id: ${{ steps.fw.outputs.firewall-id }}
