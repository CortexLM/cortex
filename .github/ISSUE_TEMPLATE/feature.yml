name: Feature request
description: Propose an improvement to the Cortex research network
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Frozen specs are guarded by `scripts/check_repo.py`. Explain any proposed
        protocol migration explicitly; never weaken a gate to accept drift.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Cortex do instead? Name Python modules or public APIs if you know them.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - challenge (bounty / proof)
        - gateway / weights
        - validator / chain
        - deploy / ops
        - RLM / shared memory
        - Firecracker isolation
        - docs / developer experience
        - other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: I have read AGENTS.md and docs/NAMING.md (`BASE_*` names and signature domains stay compatible).
          required: true
        - label: The proposal does not put a challenge catalog, benchmark, holdout, credential, or floating production image in Git.
          required: true
