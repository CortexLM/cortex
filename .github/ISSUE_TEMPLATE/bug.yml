name: Bug report
description: Report a problem in the Cortex research network software
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for defects in **this** repo (gateway, validator, challenges, RLM, VM host, deploy).
        Security issues must use private reporting; see `SECURITY.md`.
        Miner-facing docs live in this repo under `docs/external-miner/`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke, in one or two sentences.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - gateway
        - validator
        - Bounty
        - Proof
        - RLM / shared memory
        - Firecracker VM host
        - miner CLI
        - deploy / compose
        - docs
        - other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA on main, or annotated tag (v*.*.*).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands you ran (`uv run pytest`, `cortex`, or `curl`). Remove credentials, private holdouts, and exploit payloads.
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Sensitive data
      options:
        - label: I removed API keys, wallet material, private holdouts, BYOK values, and operator tokens.
          required: true
