# Algorithm 3 template (profile version >= 3). Choose the shares, the next profile
# `version` and the activation epoch, then install it as config/challenges.toml.
# The master reloads the profile before epoch emission; the cautious workflow
# restarts it between two epochs, just after a seal.
# Each challenge pays share * min(sum(leaves), 10^12) / 10^12; the rest burns.
# Container ids also need a row in deploy/challenges/registry.toml to run.
version = 3
introduced_epoch = "CHOOSE_ACTIVATION_EPOCH"

[[challenges]]
id = "bounty"
emission_share_bps = 3000
policy = "all_metagraph_hotkeys"

[[challenges]]
id = "opentype"
emission_share_bps = 3500
policy = "all_metagraph_hotkeys"

[[challenges]]
id = "proof"
emission_share_bps = 3500
policy = "all_metagraph_hotkeys"
