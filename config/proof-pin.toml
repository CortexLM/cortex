# Cortex pin for the Proof challenge (`proof`).
# Global floors only — there is no topic catalog here. Problems are
# operator-published signed documents; git never carries holdout records,
# teacher hosts, live InferenceOffer origins, or a live topic list.
#
# Deploy = bump eval_image_digest after proof-eval CI is green. Empty digest
# is the pre-launch state: live submits answer 503. Do not invent a sha256.
# `proxy_model` / `proxy_models` stay empty — no HF bake. The RLM judge is
# the live InferenceOffer, not a model id compiled into the image.
#
# Scoring image published by .github/workflows/publish-proof-eval-image.yml
# run 33892650063 (commit 51f937c7818f0eb1e3ed1412972de98b6994952b).
# Pulled that digest after push; harvest-PATH + selftest + 12.5 Gbit/s
# fabric enforcement proved on those bytes.
#
# Topic documents are signed by the `proof` row key in config/challenges.toml
# (sr25519, domain `base-proof-topic-v1`). `topic_pubkey` must match that row.
# See CEREMONY.md. This is the proof row topic key, not the live seal
# (gateway bundle-seal key is gateway_sk, off-git).
#
# Floors a topic may tighten, never loosen:
#   flops_budget_max              = 2e18
#   epsilon_nll_min               = 0.02
#   epsilon_topic_max_regress_min = 0.05
#   epsilon_throughput_rel_min    = 0.05
#   quality_floor_nll_max         = 0.02
#   max_input_tokens_ceiling      = 32768
#   max_output_tokens_ceiling     = 8192
#
# Inference: pin ceilings / modes / commitment bound the **judge** offer that
# digest-pinned proof-eval / harvest call. A topic's signed `inference{…}` may
# override / tighten those judge defaults. Optional topic field
# `require_judge_offer_commitment` is not a miner bind. Empty `model` or empty
# `base_url` is pre-launch fail-closed (like an empty digest), not a boot
# reject. The live offer (`PROOF_INFERENCE_OFFER_FILE`) is operator state
# (open/closed). Miners do not bind it. No baked Qwen; `proxy_model` /
# `proxy_models` stay empty. Missing/closed/judge down → 503.
#
# Holdout size / stratum size are the measurement harness (5 scored splits × 24),
# not the problem list.

challenge_id = "proof"
scoring_version = 1
base_model_family = "Qwen/Qwen3.8"
proxy_model = ""
proxy_models = []
inference_config_schema_version = 1
allowed_modes = ["chat", "completions", "embeddings"]
max_input_tokens_ceiling = 32768
max_output_tokens_ceiling = 8192
inference_offer_commitment_alg = "sha256"
eval_image = "ghcr.io/cortexlm/proof-eval"
eval_image_digest = "sha256:78b614a1f51ce5dd80076c4e343a2b31b85d6c36025e02836cb83929867e7009"
proof_git = "https://github.com/CortexLM/cortex"
proof_git_sha = "51f937c7818f0eb1e3ed1412972de98b6994952b"
topic_pubkey = "3e7f70f09165e265ab89ab04a4fc91dc0531d54a100c538fb14c6f008421c375"
flops_budget_max = 2000000000000000000
epsilon_nll_min = 0.02
epsilon_topic_max_regress_min = 0.05
epsilon_throughput_rel_min = 0.05
quality_floor_nll_max = 0.02
holdout_size = 120
stratum_size = 24

[inference]
provider = "openai_compatible"
base_url = ""
model = ""
mode = "chat"
max_input_tokens = 32768
max_output_tokens = 8192
