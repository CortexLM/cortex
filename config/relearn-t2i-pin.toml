# Cortex pin for Relearn Image (challenge_id = "relearn-image").
# Crate / env / domain tags keep the pre-launch `t2i` spelling.
#
# Never put secrets, judge endpoints, or holdout prompt records in this file.
#
# Generator seed: nvidia/Cosmos3-Super-Text2Image. Verified 2026-08-30 on the
# Hugging Face card: 65B Cosmos3 Super text-to-image, released for commercial
# and non-commercial use under NVIDIA OpenMDW 1.1, BF16 only, served by
# vLLM-Omni (`vllm serve ... --omni`) or Diffusers `Cosmos3OmniPipeline`.
# Flux-family checkpoints are refused by `relearn_t2i_task::base_is_rejected`.
#
# Judge: Q-Judger (Qwen/Qwen-Image-Bench, Apache-2.0, fine-tuned from
# Qwen3.6-27B). No other judge is accepted. Prompts come from the
# Qwen/Qwen-Image-Bench dataset, ids 1..=1000.
#
# The `[[frozen_prompt]]` records below are the eval prompts, verbatim. NVIDIA
# recommends upsampling a prompt into a JSON document before generation, which
# is fine for a miner's own training and fatal for a benchmark: two miners with
# two upsamplers are no longer scored on the same prompt. So the scored strings
# are frozen here and replayed exactly. Set `upsampled_json` on a record to
# freeze an upsampled document instead of the raw text.
#
# The holdout split is NOT in this file. Git carries only its commitment; the
# records live in an operator file (`RELEARN_T2I_HOLDOUT_FILE`) and are checked
# against the commitment at boot. Regenerate with:
#
#   cargo run -p xtask -- relearn-t2i-holdout --bench <bench.jsonl> \
#     --salt "$RELEARN_T2I_HOLDOUT_SALT" --size 40 --exclude <each public id> \
#     --out /root/.base-secrets/relearn-t2i-holdout.json
#
# The committed commitment below is the DEV salt "cortex-t2i-dev-holdout-v0",
# so local and staging runs work out of the box. Production must rotate to a
# private salt, replace the commitment, and re-sign (config/CEREMONY.md).

challenge_id = "relearn-image"
scoring_version = 1

base = "nvidia/Cosmos3-Super-Text2Image"
base_license = "OpenMDW-1.1"
base_license_url = "https://openmdw.ai/license/1-1/"
base_revision = "da579b9aa076ac8adb29f1a23703e54e2e5bd5fc"

judge_model = "Qwen/Qwen-Image-Bench"
judge_dataset = "Qwen/Qwen-Image-Bench"
judge_git = "https://github.com/QwenLM/Qwen-Image-Bench"

eval_image = "ghcr.io/cortexlm/relearn-image-eval"
# Same digest is also published as ghcr.io/cortexlm/relearn-t2i-eval.
# Digest from CortexLM/relearn PR #3 (`54d3537`), published by
# `publish-challenge-images`. Digest-only, never a floating tag.
eval_image_digest = "sha256:81c40dc6d5b0f66be6927b69f2129565a0cefd7331bb65b27f5a7792ab87e7ea"
relearn_git = "https://github.com/CortexLM/relearn"
relearn_git_sha = "54d3537f41fd76222acd7da932496c15046b42dd"

# Frozen sampler recipe, from the Cosmos3-Super-Text2Image card.
[sampler]
width = 1024
height = 1024
num_inference_steps = 50
guidance_scale = 4.0
flow_shift = 3.0
negative_prompt = ""
num_frames = 1
dtype = "bfloat16"
scheduler = "UniPCMultistepScheduler"

[prompts]
# Rotating the salt rotates every generation seed without touching the formula.
pin_salt = "cortex-t2i-v0"
variations_per_prompt = 4
# Public split: bench ids where `id % 25 == 1`. 40 prompts x 4 variations =
# 160 scored cells, above the 100-cell floor the paired test needs.
public_ids = [
  1, 26, 51, 76, 101, 126, 151, 176, 201, 226,
  251, 276, 301, 326, 351, 376, 401, 426, 451, 476,
  501, 526, 551, 576, 601, 626, 651, 676, 701, 726,
  751, 776, 801, 826, 851, 876, 901, 926, 951, 976,
]
holdout_commitment = "bdb6652b6b54a9607c5fdc019a7b73a17defb835efae5755db129cf426252870"
holdout_size = 40

