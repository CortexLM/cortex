# Development challenge profile (emission shares). The master reads
# this unsigned file; the gateway serves it at GET /v1/trust and validators build their
# view from that. To change shares: edit and bump `version`; the master reloads the
# profile before epoch emission, and the documented cautious workflow restarts it between
# two epochs, just after a seal. A profile change between two seals can make
# `GET /v1/weights/latest` answer "unsealed" until the next seal; previous bundles stay
# available by epoch or root. Never set `introduced_epoch` above the current epoch
# (sealing and decoding stop for older epochs). A third challenge or free shares need
# `version >= 3` (served as `challenges_version` by /v1/trust).
#
# Two live challenges. Emission: bounty = 2000, proof = 8000 bps (sum 10000).
# Readiness is independent of these shares: a missing feed, topic, baseline,
# offer, runner or image pin remains fail-closed and burns that challenge mass.
#
# `relearn`, `relearn-image`, `relearn-agent`, `relearn-mm`, `design`, and
# `prism` are OFF: they have no row here, so they have no emission and no
# leaf may verify under this root. Their product code is removed from this
# repository (historical miner stubs stay under docs/external-miner/).
version = 1
introduced_epoch = 0

[[challenges]]
id = "bounty"
emission_share_bps = 2000
policy = "all_metagraph_hotkeys"

[[challenges]]
id = "proof"
emission_share_bps = 8000
policy = "all_metagraph_hotkeys"
