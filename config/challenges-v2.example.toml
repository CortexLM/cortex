# Activation template. Choose the next profile `version` and activation epoch,
# then install it as config/challenges.toml. The master reloads the profile before
# epoch emission; the cautious workflow restarts it between two epochs, just after
# a seal. No production activation occurs from this file.
version = 2
introduced_epoch = "CHOOSE_ACTIVATION_EPOCH"

[[challenges]]
id = "bounty"
emission_share_bps = 3000
policy = "all_metagraph_hotkeys"

[[challenges]]
id = "proof"
emission_share_bps = 7000
policy = "all_metagraph_hotkeys"
