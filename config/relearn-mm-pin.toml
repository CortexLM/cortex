# Cortex pin for Relearn Multimodal (challenge_id = "relearn-mm").
#
# Never put secrets, teacher/judge endpoints, or holdout items in this file.
#
# Miners attach a vision encoder plus a projector to the champion Relearn LLM.
# They are paid to make it see and they are not paid to break it: the text
# holdout is a hard gate (see docs/RELEARN-MM.md), so a vision win that costs
# language ability scores zero rather than partial credit.
#
# Encoder pin: google/siglip2-so400m-patch14-384. Verified 2026-08-30 on the
# Hugging Face card: Apache-2.0, SigLIP 2 So400m at 384px, documented for use
# as a VLM vision tower. Miners may substitute a different encoder as long as
# its card license is OSI-permissive (Apache-2.0 / MIT / BSD / ISC); OpenRAIL
# and non-commercial terms are refused because the artifact has to stay
# redistributable. Other cards verified Apache-2.0 on the same date:
#   google/siglip-so400m-patch14-384
#   HuggingFaceM4/idefics2-8b   (vision tower is SigLIP)

challenge_id = "relearn-mm"
scoring_version = 1

# Language side: the Relearn champion's base model.
lm_base_model = "Qwen/Qwen3.8-Flash-Next"

encoder_model = "google/siglip2-so400m-patch14-384"
encoder_license = "apache-2.0"
# Fill in after recording the encoder revision the eval image pulls.
encoder_revision = ""

eval_image = "ghcr.io/cortexlm/relearn-mm-eval"
# Empty until the first digest-pinned image ships from CortexLM/relearn CI.
eval_image_digest = ""
relearn_git = "https://github.com/CortexLM/relearn"

# Vision holdout items per task family. Families are captioning, VQA,
# OCR / text-in-image, and spatial relations — deliberately not ImageNet or
# COCO test, both of which sit in every candidate encoder's pretraining mix,
# so a score there would measure memorization rather than sight.
vision_items_per_task = 40

# Agentic image-tool traces: look at a screenshot / diagram / UI, then call a
# tool or answer. Each trace is replayed with the pixels shuffled; a model that
# scores the same on shuffled pixels was reading the prompt, not the image.
# The floor is 100 because the bootstrap paired test refuses a verdict below
# 100 decided examples, and a thinner slice would hold the champion forever.
agentic_traces = 120

# Text holdout items reused from the Relearn LLM challenge (gate 1).
text_holdout_items = 120

[vision_weights]
captioning = 0.25
vqa = 0.25
ocr = 0.25
spatial_relations = 0.25
